<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concord — search the Bible by concept</title>
<meta name="description" content="Search the whole Bible by concept across twelve translations, with cross-references and topical indexes. Runs entirely in your browser, offline, with no account and no AI.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1220'/%3E%3Cpath d='M22 10.6a8 8 0 1 0 0 10.8' fill='none' stroke='%23C08542' stroke-width='3.1' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar" id="topbar">
  <a class="brand" href="#/" aria-label="Concord home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7"/>
      <path d="M22 10.6a8 8 0 1 0 0 10.8" fill="none" stroke-width="3.1" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">Concord</span>
  </a>

  <form class="searchbar" id="searchbar" role="search" autocomplete="off">
    <svg class="searchbar-icon" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17.5 17.5"/>
    </svg>
    <input id="q" type="search" name="q" placeholder="Search a concept, phrase, or reference"
           aria-label="Search the Bible" spellcheck="false">
    <button type="button" class="searchbar-clear" id="clear" aria-label="Clear search" hidden>&times;</button>
  </form>

  <div class="topbar-tools">
    <label class="select">
      <span class="sr-only">Translation</span>
      <select id="translation" aria-label="Translation"></select>
    </label>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle colour theme">
      <svg viewBox="0 0 20 20" aria-hidden="true" class="i-sun">
        <circle cx="10" cy="10" r="4"/>
        <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.6 3.6l1.4 1.4M15 15l1.4 1.4M16.4 3.6L15 5M5 15l-1.4 1.4"/>
      </svg>
      <svg viewBox="0 0 20 20" aria-hidden="true" class="i-moon">
        <path d="M16 12.3A7 7 0 0 1 7.7 4a7 7 0 1 0 8.3 8.3z"/>
      </svg>
    </button>
  </div>
</header>

<main id="main" class="main">
  <div id="view"></div>
</main>

<footer class="footer">
  <p>
    Twelve public-domain translations, 877,377 scholarly cross-references, and
    Nave's topical index. Everything runs in your browser — no account, no
    server, no AI writing scripture.
  </p>
  <p class="footer-links">
    <a href="#/books">Contents</a>
    <a href="#/saved">Saved</a>
    <a href="#/about">How it works</a>
    <a href="#/sources">Sources &amp; licences</a>
    <a href="https://github.com/nyfeblade/concord" rel="noopener">Source code</a>
  </p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
